<style>
        .gradient-border-btn {
            position: relative;
            background: transparent;
            z-index: 1;
        }

            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;

            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- TopNavBar Suppressed as this is a transactional page (Registration) -->
<main class="w-full max-w-[480px] mx-auto">
<!-- Brand Header -->
<div class="text-center mb-lg">
<h1 class="font-display text-display text-on-surface mb-xs">LUMINA</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account to continue.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.05)] p-lg border border-outline-variant/30">
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="fullName">Full Name</label>
<input class="w-full px-sm py-xs bg-surface-container-lowest border border-[#D2D2D7] rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline/50" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="email">Email Address</label>
<input class="w-full px-sm py-xs bg-surface-container-lowest border border-[#D2D2D7] rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline/50" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="password">Password</label>
<input class="w-full px-sm py-xs bg-surface-container-lowest border border-[#D2D2D7] rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="confirmPassword">Confirm Password</label>
<input class="w-full px-sm py-xs bg-surface-container-lowest border border-[#D2D2D7] rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline/50" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-xs pt-unit">
<input class="mt-[3px] rounded border-[#D2D2D7] text-primary focus:ring-primary bg-surface-container-lowest cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
<label class="font-caption text-caption text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary hover:underline underline-offset-4" href="#">Terms of Service</a> and <a class="text-primary hover:underline underline-offset-4" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm rounded-DEFAULT hover:opacity-90 transition-opacity flex justify-center items-center gap-xs mt-lg" type="submit">
                    Create Account
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-md flex items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-sm font-caption text-caption text-outline">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Alternative Action -->
<button class="w-full gradient-border-btn text-on-surface font-label-md text-label-md py-sm rounded-DEFAULT hover:bg-surface-container-low transition-colors flex justify-center items-center gap-xs" type="button">

                Sign up with Google
            </button>
</div>
<!-- Login Link -->
<div class="text-center mt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-medium hover:underline underline-offset-4 transition-all" href="#">Sign In</a>
</p>
