<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LUMINA - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                            "outline": "#717785",
                            "outline-variant": "#c1c6d6",
                            "on-secondary": "#ffffff",
                            "primary": "#0059b5",
                            "on-tertiary-fixed-variant": "#7a3000",
                            "on-secondary-fixed-variant": "#46464b",
                            "surface-variant": "#e4e2e4",
                            "inverse-on-surface": "#f3f0f2",
                            "tertiary-container": "#c25100",
                            "background": "#fcf8fb",
                            "error": "#ba1a1a",
                            "surface": "#fcf8fb",
                            "secondary-container": "#e0dfe4",
                            "on-primary-container": "#fcfbff",
                            "surface-container-lowest": "#ffffff",
                            "surface-container": "#f0edef",
                            "surface-dim": "#dcd9dc",
                            "tertiary-fixed-dim": "#ffb693",

                            "surface-tint": "#005cbb",

                            "on-secondary-fixed": "#1a1b1f",
                            "on-error": "#ffffff",
                            "tertiary-fixed": "#ffdbcb",
                            "surface-bright": "#fcf8fb",
                            "secondary": "#5e5e63",
                            "secondary-fixed-dim": "#c7c6cb",
                            "on-surface-variant": "#414753",
                            "surface-container-highest": "#e4e2e4",
                            "surface-container-high": "#eae7ea",
                            "on-tertiary-container": "#fffaf9",

                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",

                    "spacing": {

<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .btn-secondary {
            position: relative;
            background: transparent;
            z-index: 1;
        }
        .btn-secondary::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 0.25rem;
            padding: 1px;
            background: linear-gradient(135deg, #e4e2e4, #f6f3f5);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Suppressed TopNavBar for login intent -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-[0px_10px_30px_rgba(0,0,0,0.05)] p-xl">
<div class="text-center mb-lg">
<h1 class="font-display text-h3 font-bold tracking-tighter text-on-surface mb-xs">LUMINA</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<form action="#" class="space-y-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email address</label>
<div class="relative">
<input autocomplete="email" class="block w-full rounded border-[#D2D2D7] bg-surface-container-lowest py-sm px-sm text-on-surface focus:border-primary focus:ring-primary font-body-md text-body-md placeholder:text-outline/50 transition-colors duration-200" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot password?</a>
</div>
<div class="relative">
<input autocomplete="current-password" class="block w-full rounded border-[#D2D2D7] bg-surface-container-lowest py-sm px-sm text-on-surface focus:border-primary focus:ring-primary font-body-md text-body-md placeholder:text-outline/50 transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full flex justify-center py-sm px-sm border border-transparent rounded bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                Sign In
            </button>
</form>
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-caption text-caption text-on-surface-variant">Or continue with</span>
</div>
</div>
<div class="mt-md grid grid-cols-2 gap-sm">
<button class="btn-secondary w-full flex items-center justify-center px-sm py-sm rounded text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors duration-200" type="button">
<span class="material-symbols-outlined mr-2 text-[20px]" data-icon="account_circle">account_circle</span>
                    Google
                </button>
<button class="btn-secondary w-full flex items-center justify-center px-sm py-sm rounded text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors duration-200" type="button">
<span class="material-symbols-outlined mr-2 text-[20px]" data-icon="business_center">business_center</span>
                    Microsoft
                </button>
</div>
</div>
<p class="mt-lg text-center font-caption text-caption text-on-surface-variant">
            Don't have an account? <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200" href="#">Contact Sales</a>
</p>
</main>
</body></html>
